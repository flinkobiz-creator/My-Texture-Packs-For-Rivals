<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXTURES // RIVALS PACKS & ASSETS</title>
    <style>
        /* Pirxcy Minimal Cyberpunk Style Guide - RED EDITION */
        :root {
            --bg-color: #0c0a0a;
            --card-bg: #141111;
            --border-color: #2b2626;
            --border-hover: #524a4a;
            --text-main: #f5f4f4;
            --text-muted: #7a7171;
            --accent-color: #ef4444;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .header-container {
            max-width: 1100px; margin: 0 auto 50px auto;
            border-bottom: 1px dashed var(--border-color); padding-bottom: 30px;
        }

        .site-meta {
            font-family: var(--font-mono); font-size: 12px;
            color: var(--accent-color); letter-spacing: 2px;
            margin-bottom: 10px; text-transform: uppercase;
        }

        h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; text-transform: uppercase; }
        .subtitle { color: var(--text-muted); font-size: 15px; }

        .grid-container {
            max-width: 1100px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;
        }

        .texture-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 4px; padding: 24px; display: flex; flex-direction: column;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .texture-card:hover { border-color: var(--accent-color); transform: translateY(-2px); }

        .card-tag {
            font-family: var(--font-mono); font-size: 11px; color: var(--accent-color);
            border: 1px solid var(--border-color); padding: 2px 6px;
            display: inline-block; margin-bottom: 16px; text-transform: uppercase; align-self: flex-start;
        }

        .texture-preview-window {
            width: 100%; height: 180px; background-color: #070505;
            border: 1px solid var(--border-color); border-radius: 4px;
            margin-bottom: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .texture-preview-window img { width: 100%; height: 100%; object-fit: cover; }

        .texture-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; }

        .url-box {
            background-color: #070505; border: 1px solid var(--border-color); padding: 12px;
            font-family: var(--font-mono); font-size: 12px; color: #aaa1a1;
            word-break: break-all; margin-bottom: 16px; border-radius: 4px; user-select: all;
        }

        .btn-layout { display: flex; gap: 10px; margin-top: auto; }

        .action-btn {
            flex: 1; background-color: transparent; border: 1px solid var(--border-color);
            color: var(--text-main); padding: 10px; font-size: 13px; font-weight: 500;
            text-align: center; text-decoration: none; border-radius: 4px; cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .action-btn:hover { background-color: #1b1818; border-color: var(--border-hover); }

        .primary-btn { background-color: var(--accent-color); color: #ffffff; border: 1px solid var(--accent-color); }
        .primary-btn:hover { background-color: #dc2626; border-color: #dc2626; }

        footer {
            max-width: 1100px; margin: 80px auto 0 auto;
            border-top: 1px dashed var(--border-color); padding-top: 20px;
            font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="site-meta">◈ FLINKOBIZ.DEV // RIVALS MODDING ASSETS ◈</div>
        <h1>Texture Repository</h1>
        <div class="subtitle">Direct clean links for Fleasion profile injections. Click path box or button to copy.</div>
    </div>

    <div class="grid-container" id="gridContainer"></div>

    <footer>POWERED BY CLOUDFLARE PAGES GENERATION SYSTEM</footer>

    <script>
        const MY_TEXTURE_LIST = [
            { 
                name: "SCP Metal Texture", 
                file: "https://raw.githubusercontent.com/flinkobiz-creator/My-Texture-Packs-For-Rivals/refs/heads/main/Metal%20Texture.jpg",
                type: "TEXTURE"
            },
            { 
                name: "Custom Sky Sky", 
                file: "https://raw.githubusercontent.com/flinkobiz-creator/My-Texture-Packs-For-Rivals/refs/heads/main/pirxcy_skybox_spread.zip",
                type: "SKYBOX"
            },
            { 
                name: "Typewriter Font", 
                file: "https://raw.githubusercontent.com/flinkobiz-creator/My-Texture-Packs-For-Rivals/refs/heads/main/TypewriterPg-p3o1.ttf",
                type: "FONT"
            }
        ];

        const gridContainer = document.getElementById('gridContainer');
        
        MY_TEXTURE_LIST.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'texture-card';
            
            const cleanDomainPath = item.file;

            card.innerHTML = `
                <span class="card-tag">${item.type || 'ASSET'}</span>
                <div class="texture-preview-window">
                    <img src="${item.file}" alt="${item.name}" onerror="this.style.display='none'; this.parentNode.innerText='NO IMAGE FILE IN CLOUDFLARE FOLDER';">
                </div>
                <div class="texture-title">${item.name}</div>
                <div class="url-box">${cleanDomainPath}</div>
                <div class="btn-layout">
                    <button class="primary-btn action-btn" onclick="navigator.clipboard.writeText('${cleanDomainPath}'); alert('Copied clean Fleasion URL:\\n${cleanDomainPath}');">Copy Link</button>
                    <a href="${item.file}" target="_blank" class="action-btn">View Full</a>
                </div>
            `;
            gridContainer.appendChild(card);
        });
    </script>
</body>
</html>
